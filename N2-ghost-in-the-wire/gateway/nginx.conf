# N2 - GHOST IN THE WIRE gateway config
# Reverse-proxies participant traffic to the evidence portal. Listens on 8080.
# In production the shared VVV public gateway terminates TLS and forwards here.

server {
    listen 8080 default_server;
    server_name _;

    # Keep it small and stateless
    client_max_body_size 1m;

    # Security headers (defense in depth; portal also sets several)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    location / {
        proxy_pass http://portal:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }
}
