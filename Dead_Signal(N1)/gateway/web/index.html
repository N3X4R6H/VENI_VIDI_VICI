<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Research Operations Portal</title>

  <style>
    :root {
      color-scheme: light;
    }

    body {
      margin: 0;
      font: 16px/1.6 system-ui, sans-serif;
      background: #f3f5f7;
      color: #202a34;
    }

    header {
      background: #172635;
      color: white;
      padding: 22px max(24px, calc((100% - 960px) / 2));
      letter-spacing: 0.08em;
    }

    main {
      box-sizing: border-box;
      max-width: 960px;
      margin: 56px auto;
      padding: 40px;
      background: white;
      border: 1px solid #e1e6eb;
      border-radius: 10px;
    }

    .eyebrow {
      color: #607080;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      font-size: 0.8rem;
    }

    .status {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 4px;
      background: #e7f5eb;
      color: #21653a;
      font-size: 0.85rem;
    }

    footer {
      margin-top: 54px;
      color: #788491;
      font-size: 0.82rem;
    }
  </style>
</head>

<body>
  <header>
    <strong>MERIDIAN SYSTEMS</strong>
  </header>

  <main>
    <p class="eyebrow">Research Operations</p>

    <h1>Research Operations Portal</h1>

    <p>Internal research workflow management.</p>

    <p>
      Environment:
      <strong>Development</strong>
    </p>

    <span class="status">Operational</span>

    <footer>
      © Meridian Systems · Internal systems notice
    </footer>
  </main>
</body>
</html>
